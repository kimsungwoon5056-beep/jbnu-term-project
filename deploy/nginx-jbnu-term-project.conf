# JCloud Ubuntu 서버의 Nginx 사이트 설정
# 설치 위치: /etc/nginx/sites-available/jbnu-term-project
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/jbnu-term-project;
    index index.html;

    # 빌드 파일 이름에 내용 해시가 붙으므로 오래 캐시해도 된다.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 화면 주소로 바로 들어오거나 새로고침해도 React 앱이 열리도록 index.html로 보낸다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
